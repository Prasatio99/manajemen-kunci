<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Kunci</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-lg p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Manajemen Kunci</h2>
        
        <!-- Tab Navigasi -->
        <div class="flex border-b mb-6">
            <button id="btnPinjamTab" onclick="switchTab('pinjam')" class="flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600">Peminjaman</button>
            <button id="btnKembaliTab" onclick="switchTab('kembali')" class="flex-1 py-2 text-center font-semibold text-gray-500">Pengembalian</button>
        </div>

        <!-- Form Peminjaman -->
        <form id="formPinjam" onsubmit="handleForm(event, 'pinjam')" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Peminjam</label>
                <input type="text" id="nama" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Divisi</label>
                <select id="divisi" onchange="checkDivisi()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="ESRS">ESRS</option>
                    <option value="BO Eng">BO Eng</option>
                    <option value="HK">HK</option>
                    <option value="Gondola">Gondola</option>
                    <option value="Contractors">Contractors</option>
                </select>
            </div>

            <div id="divDetailPT" class="hidden">
                <label class="block text-sm font-medium text-gray-700">Detail PT (Nama Perusahaan)</label>
                <input type="text" id="detailPT" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Kunci</label>
                <input type="text" id="kunci" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Dokumentasi (Foto)</label>
                <input type="file" id="fotoPinjam" accept="image/*" capture="environment" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit" id="btnSubmitPinjam" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 font-semibold">Simpan Peminjaman</button>
        </form>

        <!-- Form Pengembalian -->
        <form id="formKembali" onsubmit="handleForm(event, 'kembali')" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700">ID Peminjaman</label>
                <input type="text" id="idKembali" required placeholder="Masukkan ID saat pinjam" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Dokumentasi Pengembalian (Foto)</label>
                <input type="file" id="fotoKembali" accept="image/*" capture="environment" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
            </div>

            <button type="submit" id="btnSubmitKembali" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 font-semibold">Proses Pengembalian</button>
        </form>

        <!-- Status Notifikasi -->
        <div id="statusMsg" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2znyWk0jQZ7PwNAbNhqM70YE96X9d6vXphkIzSpKROD4veiXuEcdJqKPpB_y8U85X/exec";

        function switchTab(tab) {
            const formPinjam = document.getElementById('formPinjam');
            const formKembali = document.getElementById('formKembali');
            const btnPinjamTab = document.getElementById('btnPinjamTab');
            const btnKembaliTab = document.getElementById('btnKembaliTab');

            if (tab === 'pinjam') {
                formPinjam.classList.remove('hidden');
                formKembali.classList.add('hidden');
                btnPinjamTab.className = "flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600";
                btnKembaliTab.className = "flex-1 py-2 text-center font-semibold text-gray-500";
            } else {
                formPinjam.classList.add('hidden');
                formKembali.classList.remove('hidden');
                btnKembaliTab.className = "flex-1 py-2 text-center font-semibold text-green-600 border-b-2 border-green-600";
                btnPinjamTab.className = "flex-1 py-2 text-center font-semibold text-gray-500";
            }
        }

        function checkDivisi() {
            const divisi = document.getElementById('divisi').value;
            const divDetailPT = document.getElementById('divDetailPT');
            if (divisi === 'Contractors') {
                divDetailPT.classList.remove('hidden');
                document.getElementById('detailPT').required = true;
            } else {
                divDetailPT.classList.add('hidden');
                document.getElementById('detailPT').required = false;
            }
        }

        async function handleForm(event, action) {
            event.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerText = "Mengirim data dan foto, mohon tunggu...";
            statusMsg.className = "mt-4 text-center text-sm font-medium text-blue-600";

            let payload = { action: action };

            if (action === 'pinjam') {
                payload.nama = document.getElementById('nama').value;
                payload.divisi = document.getElementById('divisi').value;
                payload.detailPT = document.getElementById('detailPT').value;
                payload.kunci = document.getElementById('kunci').value;
                
                const fileInput = document.getElementById('fotoPinjam');
                if (fileInput.files.length > 0) {
                    payload.fotoBase64 = await toBase64(fileInput.files[0]);
                    payload.mimeType = fileInput.files[0].type;
                }
            } else {
                payload.id = document.getElementById('idKembali').value;
                
                const fileInput = document.getElementById('fotoKembali');
                if (fileInput.files.length > 0) {
                    payload.fotoBase64 = await toBase64(fileInput.files[0]);
                    payload.mimeType = fileInput.files[0].type;
                }
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'sukses') {
                    statusMsg.innerText = result.pesan;
                    statusMsg.className = "mt-4 text-center text-sm font-medium text-green-600";
                    event.target.reset();
                    if(action === 'pinjam') checkDivisi();
                } else {
                    statusMsg.innerText = "Error: " + result.pesan;
                    statusMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
                }
            } catch (error) {
                statusMsg.innerText = "Terjadi kesalahan koneksi!";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
